services:
  - type: web
    name: cossa-ched-api
    runtime: node
    plan: starter          # persistent disks require Starter or higher (not available on Free)
    rootDir: server
    buildCommand: npm ci && npx prisma generate
    # migrate deploy runs on every boot; it's a no-op once the schema is already current
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cossa-ched-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false          # e.g. https://yourdomain.com
      - key: WEBAUTHN_RP_ID
        sync: false          # e.g. yourdomain.com  (hostname only, no protocol)
      - key: WEBAUTHN_ORIGIN
        sync: false          # e.g. https://yourdomain.com
      - key: WEBAUTHN_RP_NAME
        value: COSSA-CHED Member Portal
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false          # e.g. "COSSA-CHED <noreply@cocobod.gh>"
      - key: CONTACT_EMAIL_TO
        sync: false
      - key: SMS_PROVIDER
        sync: false          # leave blank to disable SMS
      - key: SMS_API_KEY
        sync: false
      - key: SMS_CLIENT_ID
        sync: false
      - key: SMS_SENDER_ID
        value: COSSA-CHED

databases:
  - name: cossa-ched-db
    plan: basic-256mb
    postgresMajorVersion: 16
